{% extends "base.html" %} {% block content %}
<style>
  :root {
    --cor-principal: #0096c7;
    --cor-principal-escura: #0077b6;
    --cor-perigo: #d9534f;
    --cor-perigo-escura: #c9302c;
    --cor-fundo-card: #ffffff;
    --cor-fundo-detalhe: #f1f5f9;
    --cor-texto: #1e293b;
    --cor-texto-suave: #64748b;
  }

  .delete-card {
    background-color: var(--cor-fundo-card);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    border-radius: 16px;
    border-top: 5px solid var(--cor-perigo);
    max-width: 520px;
    margin: 30px auto;
    padding: 32px;
    text-align: center;
    color: var(--cor-texto);
  }

  .delete-icon {
    font-size: 3rem;
    margin-bottom: 8px;
  }

  .delete-card h2 {
    font-size: 1.7rem;
    font-weight: 700;
    margin: 0 0 12px;
    letter-spacing: -0.5px;
  }

  .delete-card p {
    color: var(--cor-texto-suave);
    margin: 0 0 20px;
  }

  .car-resumo {
    background-color: var(--cor-fundo-detalhe);
    border-radius: 10px;
    padding: 14px;
    font-size: 1.2rem;
    font-weight: 600;
  }

  .car-resumo span {
    display: block;
    font-size: 0.85rem;
    font-weight: 400;
    color: var(--cor-texto-suave);
    margin-top: 4px;
  }

  .buttons-container {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 28px;
  }

  .btn {
    display: inline-block;
    background-color: var(--cor-principal);
    color: #fff;
    border: none;
    padding: 12px 24px;
    font-size: 16px;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    text-decoration: none !important;
    transition: all 0.3s ease;
  }

  .btn:hover {
    background-color: var(--cor-principal-escura);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(0, 150, 199, 0.4);
  }

  .btn-danger {
    background-color: var(--cor-perigo);
  }

  .btn-danger:hover {
    background-color: var(--cor-perigo-escura);
    box-shadow: 0 4px 12px rgba(217, 83, 79, 0.4);
  }
</style>

<div class="delete-card">
  <div class="delete-icon">🗑️</div>
  <h2>Excluir carro</h2>
  <p>Are you sure you want to delete this car? This action cannot be undone.</p>

  <div class="car-resumo">
    {{ object.brand }} {{ object.model }}
    <span>Placa: {{ object.plate }}</span>
  </div>

  <form method="post">
    {% csrf_token %}
    <div class="buttons-container">
      <a href="{% url 'car_update' pk=object.pk %}" class="btn btn-secondary"
        >Cancel</a
      >
      <button type="submit" class="btn btn-danger">Yes, exit</button>
    </div>
  </form>
</div>
{% endblock %}
